<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بطاقة توفر الحكام</title>

<style>
  :root{
    --pitch:#1F4D3E;
    --pitch-dark:#153A2E;
    --pitch-line:#3E7A63;
    --paper:#F1F0E9;
    --paper-raised:#FFFFFF;
    --ink:#20241F;
    --ink-soft:#6B6F64;
    --line:#DCD9CC;
    --available:#2E7D5B;
    --available-bg:#E4F3EA;
    --unavailable:#B23A32;
    --unavailable-bg:#FBE7E4;
    --pending:#A9791E;
    --pending-bg:#F7EFD9;
    --radius:14px;
    --shadow:0 2px 10px rgba(21,58,46,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    line-height:1.5;
  }
  h1,h2,h3,.display{
    font-family:'Almarai',sans-serif;
    font-weight:800;
    margin:0;
  }
  #app{max-width:760px;margin:0 auto;padding-bottom:60px;}

  /* header */
  header.top{
    background:linear-gradient(160deg,var(--pitch) 0%,var(--pitch-dark) 100%);
    color:#fff;
    padding:22px 20px 20px;
    position:relative;
    overflow:hidden;
  }
  header.top::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 46px);
    pointer-events:none;
  }
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1;}
  .brand{display:flex;align-items:center;gap:10px;}
  .whistle{width:30px;height:30px;flex:none;}
  .brand h1{font-size:19px;letter-spacing:0.2px;}
  .brand span{display:block;font-size:12px;color:#CFE3D9;font-weight:400;font-family:'Tajawal';margin-top:1px;}
  .back-btn{
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    padding:7px 14px;
    border-radius:20px;
    font-family:'Tajawal';
    font-size:13px;
    cursor:pointer;
  }
  .back-btn:active{background:rgba(255,255,255,0.28);}

  main{padding:18px 16px 10px;}

  /* generic components */
  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    box-shadow:var(--shadow);
    margin-bottom:14px;
  }
  .muted{color:var(--ink-soft);font-size:13.5px;}
  .btn{
    font-family:'Tajawal';
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:11px;
    padding:13px 18px;
    cursor:pointer;
    width:100%;
    transition:transform .08s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--pitch);color:#fff;}
  .btn-primary:disabled{background:#9CAFA6;cursor:not-allowed;}
  .btn-outline{background:transparent;color:var(--pitch);border:1.5px solid var(--pitch);}
  .btn-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);}
  .btn-danger{background:transparent;color:var(--unavailable);border:1.5px solid var(--unavailable-bg);}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{width:auto;flex:1;}
  select,input[type=text],input[type=date]{
    font-family:'Tajawal';
    font-size:15px;
    padding:12px 14px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
    width:100%;
  }

  label.field-label{
    display:block;font-size:13px;font-weight:700;color:var(--ink-soft);
    margin-bottom:6px;
  }

  .empty-note{

  .pill.unavailable{background:var(--unavailable-bg);color:var(--unavailable);}
  .pill.pending{background:var(--pending-bg);color:var(--pending);}

  .week-item .wmeta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .active-tag{background:var(--pitch);color:#fff;font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:700;}

  .day-row-edit{display:flex;gap:8px;margin-bottom:8px;align-items:center;}

  table.matrix td.unavailable{background:var(--unavailable-bg);color:var(--unavailable);font-weight:700;}

  .lock-icon{font-size:34px;margin-bottom:6px;}
  .pin-error{color:var(--unavailable);font-size:13px;min-height:18px;margin-top:8px;}

    font-size:12.5px;text-align:center;padding:9px 16px;
    border-bottom:1px solid var(--line);

<script>
/* ---------------- storage helpers ---------------- */
const memCache = {}; // fallback so the app still works if persistent storage hiccups
let storageWarned = false;
function warnStorageOnce(){
  if(storageWarned) return;
  storageWarned = true;
  const w = document.getElementById('storageWarn');
  if(w) w.style.display = 'block';
}
async function sGet(key){
  try{
    const r = await window.storage.get(key, true);
    const val = r ? JSON.parse(r.value) : null;
    if(val!==null) memCache[key]=val;
    return val;
  }catch(e){
    console.error('storage get failed', e);
    warnStorageOnce();
    return Object.prototype.hasOwnProperty.call(memCache,key) ? memCache[key] : null;
  }
}
async function sSet(key, val){
  memCache[key] = val; // always keep app usable this session
  try{
    await window.storage.set(key, JSON.stringify(val), true);
    return true;
  }catch(e){
    console.error('storage set failed', e);
    warnStorageOnce();
    return false;
  }
}
async function sDelete(key){
  delete memCache[key];
  try{ await window.storage.delete(key, true); }catch(e){ warnStorageOnce(); }
}
async function sListKeys(prefix){
  let keys = [];
  try{
    const r = await window.storage.list(prefix, true);
    keys = r ? r.keys : [];
  }catch(e){
    console.error('storage list failed', e);
    warnStorageOnce();
  }
  const memKeys = Object.keys(memCache).filter(k=>k.startsWith(prefix));
  return [...new Set([...keys, ...memKeys])];
}
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function genRefCode(){ return String(Math.floor(1000 + Math.random()*9000)); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

let STATE = { view:'home', weeks:[], activeWeekId:null, referees:[], adminTab:'weeks', adminUnlocked:false };

async function loadCore(){
  STATE.weeks = (await sGet('weeks')) || [];
  STATE.activeWeekId = await sGet('active-week');
  STATE.referees = (await sGet('referees')) || [];
  // migrate old plain-string roster to {name, code} objects
  if(STATE.referees.length && typeof STATE.referees[0] === 'string'){
    STATE.referees = STATE.referees.map(n => ({ name:n, code: genRefCode() }));
    await sSet('referees', STATE.referees);
  }
  if(STATE.weeks.length===0){
    STATE.weeks = DEFAULT_WEEKS;
    await sSet('weeks', STATE.weeks);
  }
  if(STATE.referees.length===0){
    STATE.referees = DEFAULT_REFEREES.map(n => ({ name:n, code: genRefCode() }));
    await sSet('referees', STATE.referees);
  }
}

function getWeek(id){ return STATE.weeks.find(w=>w.id===id); }

/* ---------------- routing ---------------- */
const mainEl = document.getElementById('main');
const backBtn = document.getElementById('backBtn');
const lockBtn = document.getElementById('lockBtn');
const headSub = document.getElementById('headSub');

function goto(view, opts){
  STATE.view = view;
  STATE.opts = opts || {};
  backBtn.style.display = view==='home' ? 'none' : 'block';
  lockBtn.style.display = (view==='admin' && STATE.adminUnlocked) ? 'block' : 'none';
  render();
}
backBtn.addEventListener('click', ()=>goto('home'));
lockBtn.addEventListener('click', ()=>{
  STATE.adminUnlocked = false;
  toast('تم قفل لوحة المنسق');
  goto('admin');
});

async function render(){
  headSub.textContent = 'حدّد توفرك قبل ما تنزل التكاليف';
  if(STATE.view==='home') return renderHome();
  if(STATE.view==='refEntry') return renderRefEntry();
  if(STATE.view==='refConfirm') return renderRefConfirm();
  if(STATE.view==='admin'){ headSub.textContent='لوحة تحكم المنسق'; return renderAdmin(); }

async function renderVerifiedDays(week, name){
  const area = document.getElementById('verifiedArea');
  const existing = await sGet(`avail:${week.id}:${name}`);

  if(week.days.length===0){
    area.innerHTML = `<div class="card empty-note">هذا الأسبوع ما فيه أيام مضافة بعد.</div>`;
    return;
  }

  area.innerHTML = `
    <div id="daysArea">
      ${week.days.map(d=>{
        const rec = existing?.days?.[d.id];
        const status = rec?.status || null;
        const note = rec?.note || '';
        return `
        <div class="day-card" data-day="${d.id}">
          <div class="day-head">
            <span class="day-name">${d.label}</span>
            <span class="day-date">${d.date ? formatDate(d.date) : ''}</span>
          </div>
          <div class="toggle-row">
            <div class="toggle-btn ${status==='available'?'sel-available':''}" data-status="available">متاح</div>
            <div class="toggle-btn ${status==='unavailable'?'sel-unavailable':''}" data-status="unavailable">غير متاح</div>
          </div>
          <div class="note-input" style="display:${status==='unavailable'?'block':'none'}">
            <input type="text" class="dayNote" placeholder="سبب الاعتذار (اختياري)" value="${note.replace(/"/g,'&quot;')}">
          </div>
        </div>`;
      }).join('')}
    </div>
    <button class="btn btn-primary" id="submitAvail" style="margin-top:6px">إرسال التوفر</button>
  `;

  const daysArea = document.getElementById('daysArea');
  daysArea.querySelectorAll('.day-card').forEach(card=>{
    const noteWrap = card.querySelector('.note-input');
    card.querySelectorAll('.toggle-btn').forEach(btn=>{
      btn.onclick = ()=>{
        card.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('sel-available','sel-unavailable'));
        btn.classList.add(btn.dataset.status==='available' ? 'sel-available' : 'sel-unavailable');
        card.dataset.selected = btn.dataset.status;
        noteWrap.style.display = btn.dataset.status==='unavailable' ? 'block' : 'none';
      };
    });
    if(card.querySelector('.sel-available,.sel-unavailable')){
      card.dataset.selected = card.querySelector('.sel-available') ? 'available' : 'unavailable';
    }
  });

  document.getElementById('submitAvail').onclick = async ()=>{
    const cards = [...daysArea.querySelectorAll('.day-card')];
    const daysData = {};
    let allSet = true;
    cards.forEach(card=>{
      const status = card.dataset.selected;
      if(!status) allSet = false;
      const note = card.querySelector('.dayNote')?.value?.trim() || '';
      daysData[card.dataset.day] = { status: status || null, note: status==='unavailable' ? note : '' };
    });
    if(!allSet){ toast('حدد حالتك في كل الأيام (متاح / غير متاح)'); return; }

    const btn = document.getElementById('submitAvail');
    btn.disabled = true; btn.textContent = 'جارٍ الإرسال...';

    await sSet(`avail:${week.id}:${name}`, { name, weekId:week.id, days:daysData, updatedAt: Date.now() });
    goto('refConfirm', { weekId: week.id, refName: name, daysData, weekLabel: week.label, weekDays: week.days });
  };
}

function formatDate(iso){
  try{
    const d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString('ar-EG', {weekday:'short', day:'numeric', month:'short'});
  }catch(e){ return iso; }
}

function exportWeekExcel(week, records, notResponded){
  if(week.days.length===0 || records.length===0 && notResponded.length===0){
    toast('ما فيه بيانات كافية للتصدير');
    return;
  }
  const allNames = [...new Set([...records.map(r=>r.name), ...notResponded])].sort((a,b)=>a.localeCompare(b,'ar'));

  // sheet 1: matrix
  const header = ['الحكم', ...week.days.map(d=>d.label)];
  const matrixRows = allNames.map(name=>{
    const rec = records.find(r=>r.name===name);
    const row = [name];
    week.days.forEach(d=>{
      const s = rec?.days?.[d.id]?.status;
      row.push(s==='available' ? 'متاح' : s==='unavailable' ? 'غير متاح' : 'لم يرد');
    });
    return row;
  });
  const ws1 = XLSX.utils.aoa_to_sheet([header, ...matrixRows]);

  // sheet 2: details (flat, one row per day)
  const detailHeader = ['الحكم','اليوم','التاريخ','الحالة','ملاحظة'];
  const detailRows = [];
  records.forEach(rec=>{
    week.days.forEach(d=>{
      const info = rec.days?.[d.id];
      if(!info) return;
      detailRows.push([
        rec.name, d.label, d.date || '',
        info.status==='available' ? 'متاح' : 'غير متاح',
        info.note || ''
      ]);
    });
  });
  const ws2 = XLSX.utils.aoa_to_sheet([detailHeader, ...detailRows]);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, 'المصفوفة');
  XLSX.utils.book_append_sheet(wb, ws2, 'التفاصيل');
  XLSX.writeFile(wb, `توفر-${week.label}.xlsx`);
  toast('تم تنزيل الملف');
}

function renderAdminReferees(body){
  body.innerHTML = `
    <div class="card">
      <div class="section-title">إضافة حكم للقائمة</div>
      <div class="btn-row" style="align-items:flex-start">
        <input type="text" id="newRefName" placeholder="اسم الحكم">
        <button class="btn btn-primary" id="addRefBtn" style="flex:none;width:auto;padding:12px 18px">إضافة</button>
      </div>
      <p class="muted" style="margin-top:8px">كل حكم يُعطى رمزًا سريًا من 4 أرقام تلقائيًا — أرسله له على الخاص. بدون الاسم + الرمز الصحيحين ما يقدر أحد يسجل أو يعدّل توفر حكم غيره.</p>
    </div>
    <div class="card">
      <div class="section-title">الحكام (${STATE.referees.length})</div>
      <div id="refRows"></div>
    </div>
  `;
  const rows = document.getElementById('refRows');
  function drawRows(){
    const sorted = [...STATE.referees].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
    rows.innerHTML = sorted.length ? sorted.map(r=>`
      <div class="week-item" data-name="${r.name}">
        <div>
          <div class="wname">${r.name}</div>
          <div class="wmeta">الرمز: <b style="color:var(--pitch);letter-spacing:2px">${r.code}</b></div>
        </div>
        <div class="btn-row" style="width:auto">
          <button class="btn btn-ghost" data-act="regen" style="width:auto;padding:8px 12px;font-size:12.5px">🔁 رمز جديد</button>
          <button class="btn btn-danger" data-act="remove" style="width:auto;padding:8px 12px;font-size:12.5px">حذف</button>
        </div>
      </div>
    `).join('') : '<p class="muted">لا يوجد حكام مضافين بعد.</p>';

    rows.querySelectorAll('[data-act="regen"]').forEach(b=>{
      b.onclick = async ()=>{
        const name = b.closest('.week-item').dataset.name;
        const ref = STATE.referees.find(r=>r.name===name);
        if(!ref) return;
        ref.code = genRefCode();
        await sSet('referees', STATE.referees);
        toast(`رمز جديد لـ ${name}: ${ref.code}`);
        drawRows();
      };
    });
    rows.querySelectorAll('[data-act="remove"]').forEach(b=>{
      b.onclick = async ()=>{
        const name = b.closest('.week-item').dataset.name;
        if(!confirm(`حذف ${name} من قائمة الحكام؟`)) return;
        STATE.referees = STATE.referees.filter(r=>r.name!==name);
        await sSet('referees', STATE.referees);
        drawRows();
      };
    });
  }
  drawRows();

  document.getElementById('addRefBtn').onclick = async ()=>{
    const input = document.getElementById('newRefName');
    const name = input.value.trim();
    if(!name){ return; }
    if(STATE.referees.some(r=>r.name===name)){ toast('الاسم موجود مسبقًا'); return; }
    const code = genRefCode();
    STATE.referees.push({ name, code });
    await sSet('referees', STATE.referees);
    input.value='';
    toast(`تمت الإضافة — رمز ${name}: ${code}`);
    drawRows();
  };
}

/* ---------------- boot ---------------- */
(async function boot(){
  await loadCore();
  render();
})();
</script>
</body>
</html>
